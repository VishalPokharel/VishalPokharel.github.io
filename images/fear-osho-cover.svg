<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 500" role="img" aria-labelledby="title desc">
  <title id="title">Fear cover</title>
  <desc id="desc">A simple local cover card for Fear by Osho.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f6efe4"/>
      <stop offset="0.5" stop-color="#d3b47d"/>
      <stop offset="1" stop-color="#2f342f"/>
    </linearGradient>
  </defs>
  <rect width="320" height="500" fill="url(#bg)"/>
  <rect x="24" y="26" width="272" height="448" fill="rgba(255,255,255,0.18)" stroke="#2f342f" stroke-width="3"/>
  <text x="160" y="76" fill="#2f342f" font-family="Georgia, serif" font-size="20" text-anchor="middle" letter-spacing="5">OSHO</text>
  <text x="160" y="238" fill="#151914" font-family="Georgia, serif" font-size="72" font-weight="700" text-anchor="middle">Fear</text>
  <line x1="88" y1="286" x2="232" y2="286" stroke="#151914" stroke-width="2"/>
  <text x="160" y="336" fill="#151914" font-family="Georgia, serif" font-size="18" text-anchor="middle">Understanding and</text>
  <text x="160" y="364" fill="#151914" font-family="Georgia, serif" font-size="18" text-anchor="middle">accepting uncertainty</text>
</svg>
